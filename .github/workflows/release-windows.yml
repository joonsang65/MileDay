name: Windows Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag or version to build, for example v0.1.5"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build, sign, and publish Windows release
    runs-on: windows-latest

    env:
      GH_TOKEN: ${{ github.token }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT || secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME || secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE || secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME || secrets.WINDOWS_PUBLISHER_NAME }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL || secrets.R2_PUBLIC_BASE_URL }}

    steps:
      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          $inputTag = "${{ inputs.release_tag }}"
          if ($inputTag -match '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            $tag = "v$inputTag"
          } else {
            $tag = $inputTag
          }

          if ($tag -notmatch '^v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Release tag must look like vX.Y.Z. Received: $tag"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release_tag.outputs.tag }}

      - name: Fail if GitHub Release already exists
        shell: pwsh
        run: |
          gh release view "${{ steps.release_tag.outputs.tag }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "GitHub Release already exists for ${{ steps.release_tag.outputs.tag }}. Delete it intentionally before rerunning this fallback workflow."
          }
          $global:LASTEXITCODE = 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify tag and package version
        working-directory: frontend
        run: npm run verify:release-version -- ${{ steps.release_tag.outputs.tag }}

      - name: Run lint
        working-directory: frontend
        run: npm run lint

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build and Azure sign Windows package
        working-directory: frontend
        run: npm run dist:signed

      - name: Locate release artifacts
        id: artifacts
        shell: pwsh
        working-directory: frontend
        run: .\scripts\find-release-artifacts.ps1 -Version "${{ steps.release_tag.outputs.version }}"

      - name: Verify installer signature
        id: installer_signature
        shell: pwsh
        working-directory: frontend
        run: |
          $result = .\scripts\verify-windows-signature.ps1 `
            -InstallerPath "${{ steps.artifacts.outputs.installer_path }}" `
            -ExpectedPublisher "$env:WINDOWS_PUBLISHER_NAME"
          $result | ForEach-Object { Write-Output $_ }
          $subject = ($result | Where-Object { $_ -like "SignerSubject=*" }) -replace '^SignerSubject=', ''
          $thumbprint = ($result | Where-Object { $_ -like "SignerThumbprint=*" }) -replace '^SignerThumbprint=', ''
          "subject=$subject" >> $env:GITHUB_OUTPUT
          "thumbprint=$thumbprint" >> $env:GITHUB_OUTPUT

      - name: Verify unpacked executable signature
        shell: pwsh
        working-directory: frontend
        run: |
          .\scripts\verify-windows-signature.ps1 `
            -InstallerPath "${{ steps.artifacts.outputs.unpacked_exe_path }}" `
            -ExpectedPublisher "$env:WINDOWS_PUBLISHER_NAME"

      - name: Write SHA256
        id: sha256
        shell: pwsh
        working-directory: frontend
        run: .\scripts\write-sha256.ps1 -InstallerPath "${{ steps.artifacts.outputs.installer_path }}"

      - name: Evaluate R2 configuration
        id: r2_config
        shell: pwsh
        run: |
          $names = @(
            "R2_ACCESS_KEY_ID",
            "R2_SECRET_ACCESS_KEY",
            "R2_ACCOUNT_ID",
            "R2_BUCKET",
            "R2_PUBLIC_BASE_URL"
          )

          $present = @()
          $missing = @()
          foreach ($name in $names) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              $missing += $name
            } else {
              $present += $name
            }
          }

          if ($present.Count -gt 0 -and $missing.Count -gt 0) {
            throw "Partial R2 configuration detected. Missing: $($missing -join ', ')"
          }

          $enabled = $present.Count -eq $names.Count
          "enabled=$($enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Upload installer to Cloudflare R2
        id: r2_upload
        if: steps.r2_config.outputs.enabled == 'true'
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          aws --version
          $endpoint = "https://$env:R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          $key = "releases/${{ steps.artifacts.outputs.installer_name }}"
          aws s3 cp "${{ steps.artifacts.outputs.installer_path }}" "s3://$env:R2_BUCKET/$key" --endpoint-url $endpoint --no-progress
          aws s3 cp "${{ steps.sha256.outputs.sha256_path }}" "s3://$env:R2_BUCKET/$key.sha256.txt" --endpoint-url $endpoint --no-progress
          $base = $env:R2_PUBLIC_BASE_URL.TrimEnd("/")
          $publicUrl = "$base/$key"
          "url=$publicUrl" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        id: github_release
        shell: pwsh
        run: |
          gh release create "${{ steps.release_tag.outputs.tag }}" `
            "${{ steps.artifacts.outputs.installer_path }}" `
            "${{ steps.sha256.outputs.sha256_path }}" `
            --repo "${{ github.repository }}" `
            --title "MileDay ${{ steps.release_tag.outputs.tag }}" `
            --generate-notes

          $releaseUrl = "https://github.com/${{ github.repository }}/releases/tag/${{ steps.release_tag.outputs.tag }}"
          "url=$releaseUrl" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: mileday-windows-${{ steps.release_tag.outputs.version }}
          path: |
            ${{ steps.artifacts.outputs.installer_path }}
            ${{ steps.sha256.outputs.sha256_path }}
          retention-days: 14

      - name: Write release summary
        shell: pwsh
        run: |
          $r2Url = "${{ steps.r2_upload.outputs.url }}"
          if ([string]::IsNullOrWhiteSpace($r2Url)) {
            $r2Url = "Not configured"
          }

          @"
          # MileDay Windows Release

          Version: ${{ steps.release_tag.outputs.version }}

          Artifact: ${{ steps.artifacts.outputs.installer_name }}

          Signature: Valid

          Signer: ${{ steps.installer_signature.outputs.subject }}

          Signer thumbprint: ${{ steps.installer_signature.outputs.thumbprint }}

          SHA256: ${{ steps.sha256.outputs.sha256 }}

          GitHub Release: ${{ steps.github_release.outputs.url }}

          R2 URL: $r2Url

          ## Microsoft Partner Center

          Package URL: $r2Url

          SHA256: ${{ steps.sha256.outputs.sha256 }}
          "@ >> $env:GITHUB_STEP_SUMMARY
