name: CI

on:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest

      - name: Check generated calendar contract
        run: python scripts/generate-calendar-contract.py --check

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: https://mileday.onrender.com

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run lint
        working-directory: frontend
        run: npm run lint

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Run build
        working-directory: frontend
        run: npm run build

  mobile-pwa:
    name: Mobile PWA test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-pwa

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile-pwa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run build
        run: npm run build
